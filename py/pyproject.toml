[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "porf"
version = "0.0.1"
description = "Proof-of-Render: scene generator, node, verifier"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==1.26.4",
    "Pillow==12.3.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["porf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: renders with real Blender; skipped if Blender is missing, deselect with -m \"not slow\""]
